<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EM ALMOÇO</title>

<style>

*{
    margin:0;
    overflow:hidden;
}

body{
    height:100vh;
    background:url("https://images.steamusercontent.com/ugc/178288930009093295/6999A7AF411F65386E92ECCA163C451FC69352FA/?imw=512&imh=288&ima=fit&impolicy=Letterbox&imcolor=%23000000&letterbox=true");
    background-size:cover;
    font-family:Arial, Helvetica, sans-serif;
}

/* =======================
        TEXTO
======================= */

p{
    position:absolute;
    font-size:80px;
    font-weight:bold;

    background:linear-gradient(
        90deg,
        red,
        orange,
        yellow,
        lime,
        cyan,
        blue,
        violet,
        red
    );

    background-size:400% 100%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:
        arcoiris 2s linear infinite,
        passear 8s linear infinite;
}

@keyframes arcoiris{
    from{background-position:0%;}
    to{background-position:400%;}
}

@keyframes passear{

    0%{
        left:-300px;
        top:10%;
        transform:rotate(0deg);
    }

    25%{
        left:75%;
        top:15%;
        transform:rotate(20deg);
    }

    50%{
        left:55%;
        top:75%;
        transform:rotate(-20deg);
    }

    75%{
        left:10%;
        top:50%;
        transform:rotate(15deg);
    }

    100%{
        left:-300px;
        top:10%;
        transform:rotate(360deg);
    }

}

/* =======================
      NYAN CAT
======================= */

.nyan{
    position:absolute;
    width:260px;
}

/* gato de cima */

.top{
    top:15px;
    animation:topCat 10s linear infinite;
}

/* gato de baixo */

.bottom{
    bottom:15px;
    animation:bottomCat 10s linear infinite;
}

.hamster{
    position: fixed;
    right: 20px;
    bottom: 20px;
    width: 400px;
    z-index: 1000;
    pointer-events: none;
    user-select: none;
    border-radius: 20%
}

.dance{
    position: fixed;
    top: 20px;
    left: 20px;
    width: 400px;
    z-index: 1000;
    pointer-events: none;
    user-select: none;
    border-radius: 20%
}

/* esquerda -> direita */

@keyframes topCat{

    from{
        left:-320px;
    }

    to{
        left:calc(100vw + 320px);
    }

}

/* direita -> esquerda */

@keyframes bottomCat{

    from{
        left:calc(100vw + 320px);
        transform:scaleX(-1);
    }

    to{
        left:-320px;
        transform:scaleX(-1);
    }

}

</style>
</head>

<body>

    <<audio id="musica" loop>
    <source src="https://www.myinstants.com/instant/nyanyanyanyanyanyanya-30915.mp3" type="audio/mpeg">
</audio>

<script>
const audio = document.getElementById("musica");

function iniciar() {
    audio.play();
    document.removeEventListener("click", iniciar);
    document.removeEventListener("keydown", iniciar);
}

document.addEventListener("click", iniciar);
document.addEventListener("keydown", iniciar);
</script>

<p>EM ALMOÇO.PNG</p>

<img class="nyan top"
src="https://i.pinimg.com/originals/74/63/d7/7463d78d184c43bb878ee9b63d5e8652.gif">

<img class="nyan bottom"
src="https://i.pinimg.com/originals/74/63/d7/7463d78d184c43bb878ee9b63d5e8652.gif">

<img class="hamster"
src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExem85dHBsem00dmVpbGU5NjExYWR0emxzYnlmenczOXE0eXEyOGJtZiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/eNNJyu9LTozXq/giphy.gif">

<img class="dance"
src="https://i.makeagif.com/media/4-29-2024/neg5PT.gif">

</body>
</html>
